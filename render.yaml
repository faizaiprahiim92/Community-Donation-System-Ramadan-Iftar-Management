services:
  - type: web
    name: community-donation-backend
    runtime: python
    rootDir: backend
    plan: free
    region: frankfurt

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

   

    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Community Donation System
      - key: APP_VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_BUCKET_PHOTOS
        value: photos
      - key: STORAGE_BUCKET_VIDEOS
        value: videos
